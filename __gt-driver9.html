<!DOCTYPE html><html><head><meta charset="utf-8"><title>GT DRIVER 9</title></head><body>
<pre id="out">starting...</pre>
<script>
try{ localStorage.setItem('gt_login_ok','1'); localStorage.removeItem('gt_instrument'); }catch(e){}
const results=[];
const ok=(n,d)=>results.push('PASS '+n+(d?' :: '+d:''));
const bad=(n,d)=>results.push('FAIL '+n+(d?' :: '+d:''));
const info=(n,d)=>results.push('INFO '+n+(d?' :: '+d:''));
const ifr=document.createElement('iframe'); ifr.id='app'; ifr.src='gametrader.html';
ifr.style.cssText='width:1280px;height:900px;border:0;';
document.body.appendChild(ifr);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fdoc(){ const f=document.getElementById('app'); return f&&f.contentDocument?f.contentDocument:null; }
function fwin(){ const f=document.getElementById('app'); return f&&f.contentWindow?f.contentWindow:null; }
function findInFrame(sel){ const d=fdoc(); return d?d.querySelector(sel):null; }
function clickById(id){ const el=findInFrame('#'+id); if(!el) return 'MISSING:'+id; el.click(); return 'OK'; }
function activeScreen(){ const d=fdoc(); if(!d) return null; const a=d.querySelector('.screen.active'); return a?a.id:null; }
function clickSel(sel){ const el=findInFrame(sel); if(!el) return 'MISSING:'+sel; el.click(); return 'OK'; }
function js(code){ const w=fwin(); if(!w) return 'NOFRAME'; try{ return w.eval(code); }catch(e){ return 'EVALERR:'+e.message; } }
function ctxClick(fx,fy){ const w=fwin(); const cv=findInFrame('#cv'); if(!cv) return 'NOCV';
  const r=cv.getBoundingClientRect();
  cv.dispatchEvent(new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:r.left+r.width*(fx||0.5),clientY:r.top+r.height*(fy||0.5)}));
  return 'OK'; }
async function step(name, fn){
  try{ await fn(); }catch(e){ bad(name,'EXC '+e.message); }
  const errs=js('window.__gtErrors&&window.__gtErrors.length?window.__gtErrors.join("|"):""');
  if(errs && String(errs)!=='EVALERR:window.__gtErrors is undefined' && String(errs)!==''){ bad(name,'JS ERROR: '+String(errs).slice(0,400)); js('window.__gtErrors.length=0'); }
  else js('window.__gtErrors&&(window.__gtErrors.length=0)');
}
async function boot(){
  await wait(2500);
  js(`(function(){ if(window.__gtErrInstalled) return; window.__gtErrInstalled=true; window.__gtErrors=[];
    window.addEventListener('error',function(e){ window.__gtErrors.push('ERR '+(e.message||e.type)); });
    window.addEventListener('unhandledrejection',function(e){ window.__gtErrors.push('REJ '+(e.reason&&e.reason.message||e.reason)); });
    var oe=console.error; console.error=function(){ window.__gtErrors.push('CERR '+Array.prototype.map.call(arguments,String).join(' ').slice(0,200)); oe.apply(console,arguments); }; })();`);
  await wait(300);
  const scr=activeScreen(), cards=findInFrame('#levelList')?findInFrame('#levelList').children.length:0;
  info('boot', 'screen='+scr+' cards='+cards);
  if(scr==='menu' && cards>0) ok('boot: menu populated', 'cards='+cards); else bad('boot: menu populated','screen='+scr+' cards='+cards);
}
async function run(){
  await boot();
  clickById('playBtn'); await wait(2000);
  const lessonShown=js('document.getElementById("lessonOv")?document.getElementById("lessonOv").classList.contains("show"):false');
  if(lessonShown===true){ clickById('lessonStartBtn'); await wait(600); }
  if(js('!!Game.intro')===true){ js('Game.endIntro()'); await wait(400); }

  // open long + SL
  ctxClick(0.5,0.5); await wait(300);
  clickSel('#ctxMenu [data-act="buymarket"]'); await wait(600);
  clickById('btnAddSL'); await wait(500);
  const snap1=js('(function(){const p=Game.pos;return JSON.stringify({avg:p.avg,stop:p.stop,price:Game.price,dir:p.dir,stepPts:p.stepPts});})()');
  info('pos snapshot', String(snap1));
  // widen: move stop well below avg
  js('try{Game.moveStopTo(Game.pos.avg-(Math.abs(Game.pos.avg-Game.pos.stop)*2+6));}catch(e){window.__gtErrors.push("mst "+e.message);}');
  await wait(500);
  const snap2=js('(function(){const p=Game.pos;return JSON.stringify({avg:p.avg,stop:p.stop,viol:p.violations,combo:Game.combo,log:Game.scoreLog});})()');
  info('after widen', String(snap2).slice(0,400));
  // direct call test
  js('try{Game.pos.violations=[];Game.flagStopWidening(Game.pos.avg-50);}catch(e){window.__gtErrors.push("fw "+e.message);}');
  await wait(300);
  const snap3=js('(function(){const p=Game.pos;return JSON.stringify({viol:p.violations,combo:Game.combo});})()');
  info('direct flag', String(snap3));
  if(String(snap3).indexOf('stop_widening')>=0) ok('flagStopWidening direct works','viol='+snap3); else bad('flagStopWidening direct works','viol='+snap3);
  js('try{Game.quitToMenu();}catch(e){}'); await wait(500);
  document.getElementById('out').textContent=results.join('\n');
}
run().catch(e=>{ document.getElementById('out').textContent=results.join('\n')+'\nFATAL '+e.message; });
</script></body></html>
