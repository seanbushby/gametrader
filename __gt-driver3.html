<!DOCTYPE html><html><head><meta charset="utf-8"><title>GT DRIVER 3</title></head><body>
<pre id="out">starting...</pre>
<script>
try{ localStorage.setItem('gt_login_ok','1'); localStorage.removeItem('gt_instrument'); }catch(e){}
const results=[];
const ok=(n,d)=>results.push('PASS '+n+(d?' :: '+d:''));
const bad=(n,d)=>results.push('FAIL '+n+(d?' :: '+d:''));
const info=(n,d)=>results.push('INFO '+n+(d?' :: '+d:''));
const ifr=document.createElement('iframe'); ifr.id='app'; ifr.src='gametrader.html';
ifr.style.cssText='width:1280px;height:900px;border:0;';
document.body.appendChild(ifr);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fdoc(){ const f=document.getElementById('app'); return f&&f.contentDocument?f.contentDocument:null; }
function fwin(){ const f=document.getElementById('app'); return f&&f.contentWindow?f.contentWindow:null; }
function findInFrame(sel){ const d=fdoc(); return d?d.querySelector(sel):null; }
function activeScreen(){ const d=fdoc(); if(!d) return null; const a=d.querySelector('.screen.active'); return a?a.id:null; }
function clickById(id){ const el=findInFrame('#'+id); if(!el) return 'MISSING:'+id; el.click(); return 'OK'; }
function clickSel(sel){ const el=findInFrame(sel); if(!el) return 'MISSING:'+sel; el.click(); return 'OK'; }
function pointerOn(sel){ const w=fwin(); const el=findInFrame(sel); if(!el) return 'MISSING:'+sel;
  ['pointerdown','pointerup'].forEach(t=>{ el.dispatchEvent(new w.PointerEvent(t,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse'})); });
  return 'OK'; }
function js(code){ const w=fwin(); if(!w) return 'NOFRAME'; try{ return w.eval(code); }catch(e){ return 'EVALERR:'+e.message; } }
function key(k,code){ const w=fwin(); w.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,code:code||('Key'+k.toUpperCase()),bubbles:true})); }
async function step(name, fn){
  try{ await fn(); }catch(e){ bad(name,'EXC '+e.message); }
  const errs=js('window.__gtErrors&&window.__gtErrors.length?window.__gtErrors.join("|"):""');
  if(errs && String(errs)!=='EVALERR:window.__gtErrors is undefined' && String(errs)!==''){ bad(name,'JS ERROR: '+String(errs).slice(0,400)); js('window.__gtErrors.length=0'); }
  else js('window.__gtErrors&&(window.__gtErrors.length=0)');
}
async function boot(){
  await wait(2500);
  js(`(function(){ if(window.__gtErrInstalled) return; window.__gtErrInstalled=true; window.__gtErrors=[];
    window.addEventListener('error',function(e){ window.__gtErrors.push('ERR '+(e.message||e.type)); });
    window.addEventListener('unhandledrejection',function(e){ window.__gtErrors.push('REJ '+(e.reason&&e.reason.message||e.reason)); });
    var oe=console.error; console.error=function(){ window.__gtErrors.push('CERR '+Array.prototype.map.call(arguments,String).join(' ').slice(0,200)); oe.apply(console,arguments); }; })();`);
  await wait(300);
  const scr=activeScreen(), cards=findInFrame('#levelList')?findInFrame('#levelList').children.length:0;
  info('boot', 'screen='+scr+' cards='+cards);
  if(scr==='menu' && cards>0) ok('boot: menu populated', 'cards='+cards); else bad('boot: menu populated','screen='+scr+' cards='+cards);
}
async function run(){
  await boot();
  clickById('playBtn'); await wait(1500);
  info('in game', 'screen='+activeScreen()+' speed='+js('document.getElementById("tSpeed").textContent')+' paused='+js('Game.paused'));
  // pause via pointerdown on chip
  await step('Pause chip', async()=>{
    pointerOn('#tPause'); await wait(400);
    const p=js('Game.paused'); const disp=js('document.getElementById("pauseOv").classList.contains("show")');
    info('after pause chip', 'paused='+p+' show='+disp);
    if(p===true && disp===true) ok('pause chip works','paused='+p); else bad('pause chip works','paused='+p+' show='+disp);
    pointerOn('#tPause'); await wait(300);
    ok('pause chip resumes','paused='+js('Game.paused'));
  });
  // speed cycle
  await step('Speed cycle', async()=>{
    const b=js('document.getElementById("tSpeed").textContent');
    pointerOn('#tSpeed'); await wait(250);
    const a=js('document.getElementById("tSpeed").textContent');
    info('speed', b+' → '+a);
    if(b!==a) ok('speed cycles',''+b+'→'+a); else bad('speed cycles',''+b+'→'+a);
  });
  // VWAP toggle
  await step('VWAP toggle', async()=>{
    const b=js('document.getElementById("tVwap").textContent');
    pointerOn('#tVwap'); await wait(250);
    const a=js('document.getElementById("tVwap").textContent');
    info('vwap', b+' → '+a);
    if(b!==a) ok('vwap toggles',''+b+'→'+a); else bad('vwap toggles',''+b+'→'+a);
  });
  // settings chip (pointerdown too?)
  await step('Settings chip', async()=>{
    const r=pointerOn('#tSettingsChip'); await wait(400);
    const open=js('document.getElementById("settingsDrawer")?getComputedStyle(document.getElementById("settingsDrawer")).display:"?"');
    info('settings chip', 'click='+r+' drawer='+open);
    if(open==='block') ok('settings chip opens drawer','display='+open); else bad('settings chip opens drawer','display='+open);
    clickById('settingsScrim'); await wait(200);
  });
  // L arm then C close (no position) - verify arm state semantics
  await step('Arm semantics', async()=>{
    key('l','KeyL'); await wait(200);
    const a1=js('Game.armSide');
    key('c','KeyC'); await wait(200);
    const a2=js('Game.armSide');
    key('l','KeyL'); await wait(200);
    const a3=js('Game.armSide');
    info('arm', a1+'→(C)'+a2+'→(L)'+a3);
    if(a1===1 && a2===1 && a3===null) ok('arm toggles correctly','1→1→null (C closes position only)'); else bad('arm toggles',''+a1+'→'+a2+'→'+a3);
  });
  // Esc during game returns to menu? (verify)
  await step('Esc in game', async()=>{
    js('try{Game.paused=false;Game.over=false;}catch(e){}');
    key('Escape'); await wait(600);
    const scr=activeScreen();
    info('after Esc in game', scr);
    if(scr==='menu') ok('Esc in game → menu','screen='+scr); else bad('Esc in game → menu','screen='+scr);
  });
  document.getElementById('out').textContent=results.join('\n');
}
run().catch(e=>{ document.getElementById('out').textContent=results.join('\n')+'\nFATAL '+e.message; });
</script></body></html>
