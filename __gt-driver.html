<!DOCTYPE html><html><head><meta charset="utf-8"><title>GT DRIVER</title></head><body>
<pre id="out">starting...</pre>
<script>
try{ localStorage.setItem('gt_login_ok','1'); }catch(e){}
const results=[];
const ok=(n,d)=>results.push('PASS '+n+(d?' :: '+d:''));
const bad=(n,d)=>results.push('FAIL '+n+(d?' :: '+d:''));
const info=(n,d)=>results.push('INFO '+n+(d?' :: '+d:''));
const ifr=document.createElement('iframe'); ifr.id='app'; ifr.src='gametrader.html';
ifr.style.cssText='width:1280px;height:900px;border:0;';
document.body.appendChild(ifr);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fdoc(){ const f=document.getElementById('app'); return f&&f.contentDocument?f.contentDocument:null; }
function fwin(){ const f=document.getElementById('app'); return f&&f.contentWindow?f.contentWindow:null; }
function findInFrame(sel){ const d=fdoc(); return d?d.querySelector(sel):null; }
function activeScreen(){ const d=fdoc(); if(!d) return null; const a=d.querySelector('.screen.active'); return a?a.id:null; }
function bodyClass(){ const d=fdoc(); return d?d.body.className:''; }
function clickById(id){ const el=findInFrame('#'+id); if(!el) return 'MISSING:'+id; el.click(); return 'OK'; }
function clickSel(sel){ const el=findInFrame(sel); if(!el) return 'MISSING:'+sel; el.click(); return 'OK'; }
function js(code){ const w=fwin(); if(!w) return 'NOFRAME'; try{ return w.eval(code); }catch(e){ return 'EVALERR:'+e.message; } }
async function step(name, fn){
  try{ await fn(); }catch(e){ bad(name,'EXC '+e.message); }
  const errs=js('window.__gtErrors&&window.__gtErrors.length?window.__gtErrors.join("|"):""');
  if(errs && String(errs)!=='EVALERR:window.__gtErrors is undefined' && String(errs)!==''){ bad(name,'JS ERROR: '+String(errs).slice(0,400)); js('window.__gtErrors.length=0'); }
  else js('window.__gtErrors&&(window.__gtErrors.length=0)');
}
async function boot(){
  await wait(2500);
  js(`(function(){ if(window.__gtErrInstalled) return; window.__gtErrInstalled=true; window.__gtErrors=[];
    window.addEventListener('error',function(e){ window.__gtErrors.push('ERR '+(e.message||e.type)); });
    window.addEventListener('unhandledrejection',function(e){ window.__gtErrors.push('REJ '+(e.reason&&e.reason.message||e.reason)); });
    var oe=console.error; console.error=function(){ window.__gtErrors.push('CERR '+Array.prototype.map.call(arguments,String).join(' ').slice(0,200)); oe.apply(console,arguments); }; })();`);
  await wait(300);
  const scr=activeScreen(), cards=findInFrame('#levelList')?findInFrame('#levelList').children.length:0;
  info('boot', 'screen='+scr+' cards='+cards);
  if(scr==='menu' && cards>0) ok('boot: menu populated', 'cards='+cards); else bad('boot: menu populated','screen='+scr+' cards='+cards);
}
async function run(){
  await boot();
  // PLAY
  await step('PLAY', async()=>{
    const r=clickById('playBtn'); await wait(1500);
    const scr=activeScreen();
    if(r==='OK'&&scr==='game') ok('PLAY → game','screen='+scr); else bad('PLAY → game','click='+r+' screen='+scr);
  });
  // order keys on window
  await step('Order keys', async()=>{
    const w=fwin();
    w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'l',code:'KeyL'})); await wait(200);
    const a1=js('Game?Game.armSide:"?"');
    w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'s',code:'KeyS'})); await wait(200);
    const a2=js('Game?Game.armSide:"?"');
    info('armSide', a1+'→'+a2);
    if(a1!==a2) ok('L/S keys change arm', a1+'→'+a2); else bad('L/S keys change arm', a1+'→'+a2);
    w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'c',code:'KeyC'})); await wait(200);
    info('after C', js('Game?Game.armSide:"?"'));
  });
  // pause/resume via chip
  await step('Pause/Resume', async()=>{
    clickSel('#tPauseChip'); await wait(400);
    const paused=js('document.getElementById("pauseOv")?getComputedStyle(document.getElementById("pauseOv")).display:"?"');
    info('pause overlay', String(paused));
    clickSel('#tPauseChip'); await wait(300);
    ok('pause chip toggles', 'display='+paused);
  });
  // settings drawer + layout
  await step('Settings/Layout', async()=>{
    clickById('settingsBtn'); await wait(400);
    const open=js('document.getElementById("settingsDrawer")?getComputedStyle(document.getElementById("settingsDrawer")).display:"?"');
    info('drawer', String(open));
    const lay=js('Array.from(document.querySelectorAll("[data-layout]")).map(b=>b.dataset.layout).join(",")');
    info('layout btns', String(lay));
    if(String(lay).includes('cockpit')){
      clickSel('[data-layout="cockpit"]'); await wait(400);
      ok('cockpit applied','body='+bodyClass());
      const radio=js('getComputedStyle(document.getElementById("radioMini")).display');
      const ind=js('getComputedStyle(document.getElementById("indicatorMenuBar")).display');
      info('cockpit hides', 'radio='+radio+' indicatorBar='+ind);
      clickSel('[data-layout="classic"]'); await wait(300);
      ok('classic restored','body='+bodyClass());
    } else bad('layout buttons','got='+lay);
    clickById('settingsScrim'); await wait(200);
  });
  // quit to menu
  await step('Quit to menu', async()=>{
    js('try{Game.quitToMenu();}catch(e){window.__gtErrors.push("quit "+e.message);}'); await wait(800);
    ok('quit → menu','screen='+activeScreen());
  });
  // TRAIN
  await step('TRAIN', async()=>{
    clickById('trainBtn'); await wait(600);
    const scr=activeScreen();
    const hasAcad=js('(LEVELS||[]).filter(l=>l&&l.academy).length');
    info('TRAIN','screen='+scr+' academyLevels='+hasAcad);
    ok('TRAIN','screen='+scr);
  });
  // CHALLENGE hub
  await step('CHALLENGE hub', async()=>{
    clickById('challengeHubBtn'); await wait(800);
    ok('CHALLENGE → hub','screen='+activeScreen());
    js('try{show("menu");}catch(e){}'); await wait(400);
  });
  // Daily Run
  await step('Daily Run', async()=>{
    const det=findInFrame('#practiceTools'); if(det && !det.open){ clickSel('#practiceTools summary'); await wait(300); }
    clickById('dailyRunBtn'); await wait(1600);
    const scr=activeScreen();
    info('daily run screen', scr);
    if(scr==='game') ok('Daily Run → game','screen='+scr); else bad('Daily Run → game','screen='+scr);
    js('try{Game.quitToMenu();}catch(e){}'); await wait(600);
  });
  // Custom Session with correct selects
  await step('Custom Session', async()=>{
    const det=findInFrame('#practiceTools'); if(det && !det.open){ clickSel('#practiceTools summary'); await wait(300); }
    const w=fwin();
    const set=sel=>{ const el=findInFrame(sel); if(el){ el.value='8'; el.dispatchEvent(new w.Event('change',{bubbles:true})); } };
    set('#csFromH'); set('#csFromM'); set('#csToH'); set('#csToM');
    const days=findInFrame('#csDays'); if(days){ days.value='2'; days.dispatchEvent(new w.Event('change',{bubbles:true})); }
    clickById('csGo'); await wait(1600);
    const scr=activeScreen();
    info('custom screen', scr);
    if(scr==='game') ok('Custom Session TRADE → game','screen='+scr); else bad('Custom Session TRADE → game','screen='+scr);
    js('try{Game.quitToMenu();}catch(e){}'); await wait(600);
  });
  // instrument switch
  await step('Instrument switch', async()=>{
    clickSel('#instrumentMenuBtn'); await wait(500);
    const scr=activeScreen(); info('instrument screen', scr);
    clickSel('[onclick*="xauusd"]'); await wait(900);
    const cards=findInFrame('#levelList')?findInFrame('#levelList').children.length:0;
    info('xauusd cards', cards);
    ok('instrument switch','screen='+activeScreen()+' cards='+cards);
  });
  // verdict flow (don't pre-set over)
  await step('Verdict', async()=>{
    clickById('playBtn'); await wait(1500);
    const scr1=activeScreen(); info('play2', scr1);
    if(scr1==='game'){
      js('try{Game.finish("TEST END");}catch(e){window.__gtErrors.push("finish "+e.message);}');
      await wait(1000);
      const scr=activeScreen();
      const vt=findInFrame('#vLine')?findInFrame('#vLine').textContent.slice(0,70):'none';
      info('after finish', scr+' verdict="'+vt+'"');
      if(scr==='verdict') ok('finish → verdict','screen='+scr); else bad('finish → verdict','screen='+scr);
      clickById('vFullReview'); await wait(800);
      info('FULL REVIEW →', activeScreen());
      js('try{show("menu");}catch(e){}'); await wait(400);
    } else bad('verdict flow','screen='+scr1);
  });
  // replay/rematch button
  await step('REMATCH', async()=>{
    clickById('playBtn'); await wait(1500);
    js('try{Game.finish("TEST END");}catch(e){}'); await wait(1000);
    const scr=activeScreen();
    if(scr==='verdict'){
      clickById('vRematch'); await wait(1200);
      ok('REMATCH → game','screen='+activeScreen());
    } else bad('REMATCH','screen='+scr);
    js('try{show("menu");}catch(e){}'); await wait(400);
  });
  document.getElementById('out').textContent=results.join('\n');
}
run().catch(e=>{ document.getElementById('out').textContent=results.join('\n')+'\nFATAL '+e.message; });
</script></body></html>
